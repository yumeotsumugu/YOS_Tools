<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Barcode Generator | ローカルバーコード生成</title>
  <link rel="icon" sizes="32x32" href="../assets/icon-32.png">
  <link rel="icon" sizes="256x256" href="../assets/icon.png">
  <link rel="apple-touch-icon" href="../assets/icon.png">
  <link rel="stylesheet" href="../assets/common.css">
  <script src="../assets/theme.js"></script>
  <style>
    body{min-height:100vh}
    .wrap{max-width:940px; margin:0 auto; padding:40px 24px 80px}

    header.site{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px;
      padding:14px 0 16px; background:var(--bg)}
    .mark{width:34px; height:34px; border-radius:9px; object-fit:cover; display:block;
      background:var(--navy); box-shadow:0 3px 9px #12305233}
    header.site strong{font:700 18px/1 'DM Sans','Yu Gothic',sans-serif; letter-spacing:.2px}
    .back{display:inline-flex; align-items:center; gap:6px; margin-left:auto; padding:8px 12px;
      border:1px solid var(--line); border-radius:999px; background:var(--paper);
      color:var(--muted); font-size:12px; text-decoration:none}
    .back:hover{border-color:var(--blue); color:var(--blue)}

    .hero{margin-bottom:26px}
    .hero h1{margin:0 0 8px; font-size:24px; letter-spacing:-.4px}
    .hero p{margin:0; max-width:620px; color:var(--muted); font-size:13px}

    .panel{display:grid; grid-template-columns:1fr 320px; gap:20px; align-items:start}
    @media (max-width:760px){ .panel{grid-template-columns:1fr} }

    .card{padding:20px; border:1px solid var(--line); border-radius:14px; background:var(--paper);
      box-shadow:0 4px 16px #1c355910}
    .fld{display:block; margin-bottom:14px}
    .fld > span{display:block; margin-bottom:6px; color:var(--faint);
      font:700 10px/1 'DM Sans','Yu Gothic',sans-serif; letter-spacing:1.2px}
    textarea, input[type=text], select, input[type=number]{
      width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
      font:inherit; font-size:13px; background:var(--bg); color:var(--ink)}
    textarea{min-height:60px; resize:vertical; line-height:1.5}
    textarea:focus, input:focus, select:focus{outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue)}

    .opts{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    .opts .full{grid-column:1 / -1}
    .color-row{display:flex; align-items:center; gap:8px}
    .color-row input[type=color]{width:40px; height:34px; padding:2px; border:1px solid var(--line);
      border-radius:7px; background:var(--bg); cursor:pointer; flex:0 0 auto}
    .color-row .hex{width:92px; flex:0 0 auto; padding:8px 10px; border:1px solid var(--line);
      border-radius:7px; font:600 12px/1 'DM Sans',monospace; letter-spacing:.5px;
      text-transform:uppercase; background:var(--bg); color:var(--ink)}
    .color-row .hex:focus{outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue)}
    .color-row .hex.bad{border-color:var(--ng); color:var(--ng)}
    .chk{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer}

    .fmt-hint{margin:10px 0 0; color:var(--faint); font-size:11px; line-height:1.6}
    .fmt-hint b{color:var(--muted)}

    .preview-card{display:flex; flex-direction:column; align-items:center; gap:14px}
    .stage{width:100%; display:grid; place-items:center; padding:16px; border-radius:12px;
      background-color:var(--soft);
      background-image:
        conic-gradient(from 90deg at 50% 50%, #00000000 25%, #0000000d 0 50%, #00000000 0 75%, #0000000d 0);
      background-size:22px 22px}
    #preview{max-width:100%; height:auto; border-radius:6px; box-shadow:0 2px 10px #1c355922}
    #preview.empty{display:none}
    .ph{color:var(--faint); font-size:12px; text-align:center; padding:40px 10px}
    .ph.err{color:var(--ng)}
    .meta{width:100%; display:flex; justify-content:space-between; gap:8px; color:var(--faint); font-size:11px}

    .actions{display:flex; flex-wrap:wrap; gap:8px; width:100%}
    button.btn{flex:1; min-width:92px; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
      background:var(--paper); color:var(--ink); font:700 12px 'DM Sans','Yu Gothic',sans-serif;
      cursor:pointer}
    button.btn:hover:not(:disabled){border-color:var(--blue); color:var(--blue)}
    button.btn.primary{background:var(--navy); color:#fff; border-color:var(--navy)}
    button.btn.primary:hover:not(:disabled){background:var(--blue); border-color:var(--blue); color:#fff}
    button.btn:disabled{opacity:.45; cursor:default}

    .hist{margin-top:26px}
    .hist-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
    .hist-head h2{margin:0; font-size:14px}
    .hist-head button{padding:6px 10px; border:1px solid var(--line); border-radius:7px; background:var(--paper);
      color:var(--muted); font-size:11px; cursor:pointer}
    .hist-head button:hover{border-color:#e0602f; color:#e0602f}
    ul.hist-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
    ul.hist-list li{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line);
      border-radius:9px; background:var(--paper)}
    ul.hist-list li .txt{flex:1; min-width:0}
    ul.hist-list li .txt b{display:block; font-weight:500; font-size:12.5px; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis}
    ul.hist-list li .txt small{color:var(--faint); font-size:10px}
    ul.hist-list li .use{padding:5px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg);
      color:var(--blue); font:700 11px 'DM Sans',sans-serif; cursor:pointer; flex:0 0 auto}
    ul.hist-list li .use:hover{border-color:var(--blue)}
    ul.hist-list li .del{border:0; background:none; color:var(--faint); font-size:16px; cursor:pointer;
      line-height:1; padding:2px 4px; flex:0 0 auto}
    ul.hist-list li .del:hover{color:#e0602f}
    .hist-empty{color:var(--faint); font-size:12px; padding:8px 2px}

    .privacy{display:inline-flex; align-items:center; gap:8px; margin-top:22px;
      padding:8px 13px; border:1px solid var(--line); border-radius:999px;
      background:var(--paper); color:var(--muted); font-size:11px}
    .privacy b{color:var(--ink)}

    .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(10px);
      padding:10px 16px; border-radius:8px; background:var(--navy); color:#fff; font-size:12px;
      opacity:0; pointer-events:none; transition:.2s}
    .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <img class="mark" src="../assets/icon.png" alt="">
      <strong>Barcode Generator</strong>
      <button data-yos-theme-toggle style="margin-left:auto"></button>
      <a class="back" href="../index.html">← ツール一覧</a>
    </header>

    <section class="hero">
      <h1>バーコードジェネレーター</h1>
      <p>商品番号や管理コードを入れるだけで 1 次元バーコード（CODE128・JAN／EAN・UPC・CODE39・ITF など）を生成します。棚札・在庫管理・同人頒布物の管理番号などに。生成も履歴もすべてこの端末の中だけで処理されます。</p>
    </section>

    <div class="panel">
      <div class="card">
        <label class="fld">
          <span>値（コード内容）</span>
          <textarea id="text" placeholder="例：4901234567894　または ABC-0012" autofocus></textarea>
        </label>

        <div class="opts">
          <label class="fld full">
            <span>規格</span>
            <select id="format">
              <option value="CODE128" selected>CODE128（自動・英数字OK）</option>
              <option value="CODE128A">CODE128-A（大文字・制御文字）</option>
              <option value="CODE128B">CODE128-B（大小文字・記号）</option>
              <option value="CODE128C">CODE128-C（数字のみ・桁が偶数）</option>
              <option value="EAN13">JAN / EAN-13（数字12〜13桁）</option>
              <option value="EAN8">EAN-8（数字7〜8桁）</option>
              <option value="UPC">UPC-A（数字11〜12桁）</option>
              <option value="CODE39">CODE39（英大文字・数字・一部記号）</option>
              <option value="ITF">ITF（数字・桁数偶数）</option>
              <option value="ITF14">ITF-14（数字13〜14桁）</option>
              <option value="MSI">MSI（数字のみ）</option>
              <option value="pharmacode">Pharmacode（3〜131070）</option>
              <option value="codabar">Codabar（数字と - $ : / . +）</option>
            </select>
          </label>
          <label class="fld">
            <span>バーの幅 (px・最小モジュール)</span>
            <input type="number" id="barWidth" min="1" max="6" step="1" value="2">
          </label>
          <label class="fld">
            <span>バーの高さ (px)</span>
            <input type="number" id="barHeight" min="20" max="300" step="10" value="100">
          </label>
          <label class="fld">
            <span>余白（px）</span>
            <input type="number" id="margin" min="0" max="40" step="2" value="10">
          </label>
          <label class="fld">
            <span>文字サイズ (px)</span>
            <input type="number" id="fontSize" min="8" max="40" step="1" value="20">
          </label>
          <label class="fld">
            <span>文字位置</span>
            <select id="textPosition">
              <option value="bottom" selected>下</option>
              <option value="top">上</option>
            </select>
          </label>
          <label class="fld">
            <span>文字寄せ</span>
            <select id="textAlign">
              <option value="center" selected>中央</option>
              <option value="left">左</option>
              <option value="right">右</option>
            </select>
          </label>
          <div class="fld">
            <span>線の色</span>
            <div class="color-row">
              <input type="color" id="fg" value="#000000" aria-label="線の色">
              <input type="text" id="fgv" class="hex" value="#000000" maxlength="7"
                spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="線の色（16進）">
            </div>
          </div>
          <div class="fld full">
            <span>背景色</span>
            <div class="color-row">
              <input type="color" id="bg" value="#ffffff" aria-label="背景色">
              <input type="text" id="bgv" class="hex" value="#ffffff" maxlength="7"
                spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="背景色（16進）">
              <label class="chk"><input type="checkbox" id="transparent"> 透明</label>
            </div>
          </div>
          <label class="chk full"><input type="checkbox" id="displayValue" checked> 値の文字を下に表示する</label>
        </div>

        <p class="fmt-hint" id="fmtHint"></p>
      </div>

      <div class="card preview-card">
        <div class="stage">
          <svg id="preview" class="empty" aria-label="生成されたバーコード"></svg>
          <div class="ph" id="ph">ここにプレビューが表示されます</div>
        </div>
        <div class="meta">
          <span id="metaFmt">—</span>
          <span id="metaLen">0 文字</span>
        </div>
        <div class="actions">
          <button class="btn primary" id="dlPng" disabled>PNG保存</button>
          <button class="btn" id="dlSvg" disabled>SVG保存</button>
          <button class="btn" id="copyImg" disabled>画像コピー</button>
        </div>
      </div>
    </div>

    <div class="hist">
      <div class="hist-head">
        <h2>履歴</h2>
        <button id="clearHist">すべて削除</button>
      </div>
      <ul class="hist-list" id="histList"></ul>
      <div class="hist-empty" id="histEmpty">まだ履歴はありません。生成すると自動で保存されます（この端末のブラウザ内のみ）。</div>
    </div>

    <span class="privacy">◇ <span><b>端末内処理</b> ／ バーコードも履歴も外部に送信されません</span></span>
  </div>

  <div class="toast" id="toast"></div>

  <script src="lib/JsBarcode.all.min.js"></script>
  <script>
  (function(){
    'use strict';
    var HIST_KEY = 'yos.barcode.history.v1';
    var OPTS_KEY = 'yos.barcode.opts.v1';
    var HIST_MAX = 50;

    var $ = function(id){ return document.getElementById(id); };
    var els = {
      text:$('text'), format:$('format'), barWidth:$('barWidth'), barHeight:$('barHeight'),
      margin:$('margin'), fontSize:$('fontSize'), textPosition:$('textPosition'), textAlign:$('textAlign'),
      fg:$('fg'), fgv:$('fgv'), bg:$('bg'), bgv:$('bgv'), transparent:$('transparent'), displayValue:$('displayValue'),
      fmtHint:$('fmtHint'),
      preview:$('preview'), ph:$('ph'), metaFmt:$('metaFmt'), metaLen:$('metaLen'),
      dlPng:$('dlPng'), dlSvg:$('dlSvg'), copyImg:$('copyImg'),
      histList:$('histList'), histEmpty:$('histEmpty'), clearHist:$('clearHist'),
      toast:$('toast')
    };

    // 規格ごとの入力ヒントと表示名
    var FORMATS = {
      CODE128:   { label:'CODE128',   hint:'英数字・記号（ASCII）をそのまま入れられます。桁数は自由。JAN や社内コードで迷ったらこれ。' },
      CODE128A:  { label:'CODE128-A', hint:'大文字・数字・制御文字用のサブセットです。' },
      CODE128B:  { label:'CODE128-B', hint:'大小文字・数字・記号用のサブセットです。' },
      CODE128C:  { label:'CODE128-C', hint:'数字のみ・桁数が<b>偶数</b>である必要があります（2桁で1シンボル）。' },
      EAN13:     { label:'JAN / EAN-13', hint:'数字<b>12桁</b>を入れるとチェックデジットを自動計算します（13桁ならそのまま検証）。日本の商品コード（JAN）はこれ。' },
      EAN8:      { label:'EAN-8',     hint:'数字<b>7桁</b>でチェックデジット自動計算（8桁ならそのまま検証）。' },
      UPC:       { label:'UPC-A',     hint:'数字<b>11桁</b>でチェックデジット自動計算（12桁ならそのまま検証）。北米の商品コード。' },
      CODE39:    { label:'CODE39',    hint:'英大文字・数字・記号（- . 空白 $ / + %）。物流・図書館などで広く使われます。' },
      ITF:       { label:'ITF',       hint:'数字のみ・桁数は<b>偶数</b>。段ボール表示などで使われるインターリーブド 2/5。' },
      ITF14:     { label:'ITF-14',    hint:'数字<b>13桁</b>でチェックデジット自動計算（14桁ならそのまま）。集合包装用（GTIN-14）。' },
      MSI:       { label:'MSI',       hint:'数字のみ。倉庫の棚番号などで使われます。<b>一般的なスキャナーアプリ（YOS の Barcode Scan を含む）では読み取れないことが多い</b>規格です。' },
      pharmacode:{ label:'Pharmacode', hint:'<b>3〜131070</b> の整数のみ。医薬品のパッケージ管理用。<b>YOS の Barcode Scan では読み取れません</b>（専用スキャナー向け）。' },
      codabar:   { label:'Codabar',   hint:'数字と - $ : / . + 。血液バッグ・宅配便の伝票などで使われます。' }
    };

    var state = { valid:false, value:'', fmtKey:'CODE128' };
    var toastTimer = null;
    function toast(msg){
      els.toast.textContent = msg;
      els.toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ els.toast.classList.remove('show'); }, 1800);
    }

    /* ---------- オプションの保存・復元 ---------- */
    function clampNum(v, lo, hi, dflt){
      v = parseFloat(v);
      if (isNaN(v)) return dflt;
      return Math.min(hi, Math.max(lo, v));
    }
    function readOpts(){
      return {
        format: els.format.value,
        // バー幅は整数ピクセルに限定（半端な値だとバーが半ピクセルに掛かってボケ、読み取り不可になる）
        barWidth: Math.round(clampNum(els.barWidth.value, 1, 6, 2)),
        barHeight: clampNum(els.barHeight.value, 20, 300, 100),
        margin: clampNum(els.margin.value, 0, 40, 10),
        fontSize: clampNum(els.fontSize.value, 8, 40, 20),
        textPosition: els.textPosition.value,
        textAlign: els.textAlign.value,
        fg: els.fg.value,
        bg: els.bg.value,
        transparent: els.transparent.checked,
        displayValue: els.displayValue.checked
      };
    }
    function saveOpts(){
      try { localStorage.setItem(OPTS_KEY, JSON.stringify(readOpts())); } catch(e){}
    }
    function loadOpts(){
      var o;
      try { o = JSON.parse(localStorage.getItem(OPTS_KEY) || 'null'); } catch(e){ o = null; }
      if (!o) return;
      if (o.format && FORMATS[o.format]) els.format.value = o.format;
      if (o.barWidth != null) els.barWidth.value = Math.round(clampNum(o.barWidth, 1, 6, 2));
      if (o.barHeight != null) els.barHeight.value = o.barHeight;
      if (o.margin != null) els.margin.value = o.margin;
      if (o.fontSize != null) els.fontSize.value = o.fontSize;
      if (o.textPosition) els.textPosition.value = o.textPosition;
      if (o.textAlign) els.textAlign.value = o.textAlign;
      if (o.fg) els.fg.value = o.fg;
      if (o.bg) els.bg.value = o.bg;
      els.transparent.checked = !!o.transparent;
      if (typeof o.displayValue === 'boolean') els.displayValue.checked = o.displayValue;
    }

    function jsbOptions(opt){
      return {
        format: opt.format,
        width: opt.barWidth,
        height: opt.barHeight,
        margin: opt.margin,
        displayValue: opt.displayValue,
        fontSize: opt.fontSize,
        textPosition: opt.textPosition,
        textAlign: opt.textAlign,
        lineColor: opt.fg,
        background: opt.transparent ? 'rgba(0,0,0,0)' : opt.bg,
        font: "'DM Sans','Yu Gothic',sans-serif"
      };
    }

    /* ---------- 生成・描画 ---------- */
    var genTimer = null;
    function scheduleGenerate(){
      clearTimeout(genTimer);
      genTimer = setTimeout(generate, 180);
    }

    function clearPreview(){
      while (els.preview.firstChild) els.preview.removeChild(els.preview.firstChild);
      els.preview.removeAttribute('width');
      els.preview.removeAttribute('height');
      els.preview.removeAttribute('viewBox');
      els.preview.removeAttribute('style');
      els.preview.classList.add('empty');
    }

    var histTimer = null;
    function generate(){
      var value = els.text.value.trim();
      var opt = readOpts();
      saveOpts();
      state.value = value;
      state.fmtKey = opt.format;
      els.metaLen.textContent = value.length + ' 文字';
      var f = FORMATS[opt.format] || { label: opt.format, hint: '' };
      els.fmtHint.innerHTML = f.hint;

      if (!value){
        state.valid = false;
        clearPreview();
        els.ph.style.display = '';
        els.ph.classList.remove('err');
        els.ph.textContent = 'ここにプレビューが表示されます';
        els.metaFmt.textContent = '—';
        setActions(false);
        return;
      }

      state.valid = false;
      clearPreview();
      try {
        JsBarcode(els.preview, value, Object.assign(jsbOptions(opt), {
          valid: function(ok){ state.valid = ok; }
        }));
      } catch(e){ state.valid = false; }

      if (!state.valid){
        clearPreview();
        els.ph.style.display = '';
        els.ph.classList.add('err');
        els.ph.textContent = 'この規格では読み取れない値です。' + (f.hint ? '規格の条件（' + stripTags(f.hint) + '）を確認してください。' : '');
        els.metaFmt.textContent = f.label;
        setActions(false);
        return;
      }

      els.preview.classList.remove('empty');
      els.ph.style.display = 'none';
      els.ph.classList.remove('err');
      els.metaFmt.textContent = f.label;
      setActions(true);

      clearTimeout(histTimer);
      histTimer = setTimeout(function(){ addHistory(value, opt.format); }, 1400);
    }

    function stripTags(s){ return String(s).replace(/<[^>]*>/g, ''); }

    function setActions(on){
      els.dlPng.disabled = !on;
      els.dlSvg.disabled = !on;
      els.copyImg.disabled = !on || !(navigator.clipboard && window.ClipboardItem);
    }

    /* ---------- 書き出し ---------- */
    function currentSvgString(){
      var clone = els.preview.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
    }

    function renderCanvas(scale){
      var opt = readOpts();
      var cv = document.createElement('canvas');
      JsBarcode(cv, state.value, Object.assign(jsbOptions(opt), { valid: function(){} }));
      if (scale && scale !== 1){
        var big = document.createElement('canvas');
        big.width = cv.width * scale;
        big.height = cv.height * scale;
        var bctx = big.getContext('2d');
        bctx.imageSmoothingEnabled = false;
        bctx.drawImage(cv, 0, 0, big.width, big.height);
        return big;
      }
      return cv;
    }

    function safeName(value){
      var base = String(value).replace(/[\\/:*?"<>|\s]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
      if (!base) base = 'barcode';
      return base.slice(0, 40);
    }
    function triggerDownload(href, filename){
      var a = document.createElement('a');
      a.href = href; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
    }

    els.dlPng.addEventListener('click', function(){
      if (!state.valid) return;
      var cv = renderCanvas(3);   // 3倍で書き出して十分な解像度に
      triggerDownload(cv.toDataURL('image/png'), 'barcode_' + safeName(state.value) + '.png');
    });

    els.dlSvg.addEventListener('click', function(){
      if (!state.valid) return;
      var blob = new Blob([currentSvgString()], { type: 'image/svg+xml' });
      var url = URL.createObjectURL(blob);
      triggerDownload(url, 'barcode_' + safeName(state.value) + '.svg');
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    });

    els.copyImg.addEventListener('click', function(){
      if (!state.valid || !(navigator.clipboard && window.ClipboardItem)) return;
      renderCanvas(3).toBlob(function(blob){
        if (!blob){ toast('コピーに失敗しました'); return; }
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
          .then(function(){ toast('画像をコピーしました'); })
          .catch(function(){ toast('コピーに失敗しました'); });
      }, 'image/png');
    });

    /* ---------- 履歴 ---------- */
    function loadHistory(){
      try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]') || []; }
      catch(e){ return []; }
    }
    function storeHistory(list){
      try { localStorage.setItem(HIST_KEY, JSON.stringify(list)); } catch(e){}
    }
    function addHistory(value, format){
      if (!value) return;
      var list = loadHistory().filter(function(it){ return !(it.value === value && it.format === format); });
      list.unshift({ value: value, format: format, ts: Date.now() });
      if (list.length > HIST_MAX) list = list.slice(0, HIST_MAX);
      storeHistory(list);
      renderHistory();
    }
    function fmtDate(ts){
      var d = new Date(ts);
      var p = function(n){ return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' +
        p(d.getHours()) + ':' + p(d.getMinutes());
    }
    function renderHistory(){
      var list = loadHistory();
      els.histList.innerHTML = '';
      els.histEmpty.style.display = list.length ? 'none' : '';
      list.forEach(function(it, idx){
        var li = document.createElement('li');
        var txt = document.createElement('div');
        txt.className = 'txt';
        var b = document.createElement('b'); b.textContent = it.value;
        var s = document.createElement('small');
        var lab = (FORMATS[it.format] && FORMATS[it.format].label) || it.format;
        s.textContent = lab + '・' + fmtDate(it.ts);
        txt.appendChild(b); txt.appendChild(s);

        var use = document.createElement('button');
        use.className = 'use'; use.type = 'button'; use.textContent = '使う';
        use.addEventListener('click', function(){
          els.text.value = it.value;
          if (it.format && FORMATS[it.format]) els.format.value = it.format;
          generate();
          els.text.focus();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        var del = document.createElement('button');
        del.className = 'del'; del.type = 'button'; del.title = '削除';
        del.setAttribute('aria-label', '削除'); del.textContent = '×';
        del.addEventListener('click', function(){
          var cur = loadHistory();
          cur.splice(idx, 1);
          storeHistory(cur);
          renderHistory();
        });

        li.appendChild(txt); li.appendChild(use); li.appendChild(del);
        els.histList.appendChild(li);
      });
    }
    els.clearHist.addEventListener('click', function(){
      if (!loadHistory().length) return;
      if (!confirm('履歴をすべて削除しますか？')) return;
      storeHistory([]);
      renderHistory();
    });

    /* ---------- 配線 ---------- */
    function normHex(v){
      v = String(v).trim().replace(/^#/, '');
      if (/^[0-9a-fA-F]{3}$/.test(v)) v = v[0]+v[0] + v[1]+v[1] + v[2]+v[2];
      return /^[0-9a-fA-F]{6}$/.test(v) ? '#' + v.toLowerCase() : null;
    }
    function bindColor(swatch, hex){
      swatch.addEventListener('input', function(){
        hex.value = swatch.value.toUpperCase();
        hex.classList.remove('bad');
        scheduleGenerate();
      });
      hex.addEventListener('input', function(){
        var n = normHex(hex.value);
        if (n){
          hex.classList.remove('bad');
          swatch.value = n;
          scheduleGenerate();
        } else {
          hex.classList.add('bad');
        }
      });
      hex.addEventListener('blur', function(){
        hex.value = (normHex(hex.value) || swatch.value).toUpperCase();
        hex.classList.remove('bad');
      });
    }
    bindColor(els.fg, els.fgv);
    bindColor(els.bg, els.bgv);
    els.text.addEventListener('input', scheduleGenerate);
    els.format.addEventListener('change', scheduleGenerate);
    els.barWidth.addEventListener('input', scheduleGenerate);
    els.barHeight.addEventListener('input', scheduleGenerate);
    els.margin.addEventListener('input', scheduleGenerate);
    els.fontSize.addEventListener('input', scheduleGenerate);
    els.textPosition.addEventListener('change', scheduleGenerate);
    els.textAlign.addEventListener('change', scheduleGenerate);
    els.transparent.addEventListener('change', scheduleGenerate);
    els.displayValue.addEventListener('change', scheduleGenerate);

    loadOpts();
    els.fgv.value = els.fg.value.toUpperCase();
    els.bgv.value = els.bg.value.toUpperCase();
    renderHistory();
    setActions(false);
    generate();
  })();
  </script>
</body>
</html>
