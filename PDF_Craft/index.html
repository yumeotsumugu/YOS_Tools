<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>PDF Craft | ローカルPDFワークスペース</title>
  <link rel="icon" sizes="32x32" href="../assets/icon-32.png">
  <link rel="icon" sizes="256x256" href="../assets/icon.png">
  <link rel="apple-touch-icon" href="../assets/icon.png">
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    /* 共通トークン（--navy/--blue/--bg/--paper/--line/--ink/--muted/--faint/--soft）は
       ../assets/common.css で定義。ここは PDF Craft 固有のレイアウトのみ。 */
    body{min-width:1024px}

    .topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--paper);border-bottom:1px solid var(--line)}
    .brand,.top-actions,.history-actions,.save-actions,.view-actions,.workspace-head,.selection-bar,.status-line{display:flex;align-items:center}
    .brand{gap:11px}
    .brand strong{display:block;font:700 18px/18px var(--font-head)}
    .brand small{display:block;margin-top:4px;color:var(--faint);font-size:10px;letter-spacing:.8px}
    .top-actions{gap:8px}
    .primary-btn,.secondary-btn,.save-btn,.outline-btn,.ghost-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;font-weight:700;white-space:nowrap}
    .ghost-btn{color:var(--muted);padding:9px 12px;font-size:12px}
    .ghost-btn:hover{background:var(--soft);color:var(--navy)}
    .primary-btn{padding:10px 15px;background:var(--navy);color:#fff;font-size:12px;box-shadow:0 4px 10px #12305224}

    .app-shell{display:grid;grid-template-columns:205px minmax(580px,1fr) 235px;min-height:calc(100vh - 128px)}
    .sidebar{padding:28px 15px;background:var(--soft);border-right:1px solid var(--line)}
    .side-label{margin:0 12px 13px;color:var(--faint);font:700 10px var(--font-head);letter-spacing:1.3px}
    .side-label-spaced{margin-top:30px}
    .tool-btn{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;margin:3px 0;border-radius:6px;color:var(--muted);text-align:left;font-size:12px;font-weight:700}
    .tool-btn:hover,.tool-btn.active{background:color-mix(in srgb, var(--blue) 12%, var(--paper));color:var(--blue)}
    .soon{margin-left:auto;padding:2px 5px;border-radius:3px;color:var(--faint);background:var(--soft);font-size:9px}
    .privacy-note{display:flex;gap:9px;margin:28px 6px 0;padding:12px 8px;border-top:1px solid var(--line);color:var(--muted)}
    .privacy-note strong{font-size:11px}
    .privacy-note p{margin:4px 0 0;color:var(--faint);font-size:9px}

    .main-area{padding:38px 42px 34px;overflow:hidden}
    .workspace-head{justify-content:space-between;margin-bottom:30px}
    .eyebrow{color:var(--faint);font:700 10px var(--font-head);letter-spacing:1.6px}
    .workspace-head h1{margin:5px 0 4px;font-size:27px;letter-spacing:-.8px}
    .workspace-head p{margin:0;color:var(--muted);font-size:12px}
    .view-actions{gap:8px;color:var(--muted);font:500 11px var(--font-head)}
    .square-btn{width:29px;height:29px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:var(--paper);font-size:17px;color:var(--muted)}

    .mode-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
    .mode-bar label{color:var(--muted);font-size:11px;font-weight:700}
    .mode-bar input[type=text],.mode-bar input[type=number]{width:150px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font:inherit;font-size:12px;background:var(--paper);color:var(--ink)}
    .mode-bar input[type=number]{width:74px}
    .mode-bar .hint{color:var(--faint);font-size:10px}

    .drop-zone{min-height:190px;display:grid;place-content:center;justify-items:center;border:1px dashed var(--line);border-radius:10px;background:var(--soft);text-align:center;transition:.2s}
    .drop-zone.drag-active{border-color:var(--blue);background:color-mix(in srgb, var(--blue) 12%, var(--paper));transform:scale(1.01)}
    .drop-icon,.empty-illustration{display:grid;place-items:center;color:var(--blue);background:color-mix(in srgb, var(--blue) 14%, var(--paper))}
    .drop-icon{width:43px;height:43px;margin-bottom:10px;border-radius:50%}
    .drop-zone h2,.empty-state h2{margin:0 0 5px;font-size:15px}
    .drop-zone p,.empty-state p{margin:0;color:var(--muted);font-size:11px}
    .inline-link{padding:0;color:var(--blue);text-decoration:underline}
    .drop-meta{margin-top:12px;color:var(--faint);font-size:10px}

    .workspace{min-height:275px}
    .selection-bar{justify-content:space-between;padding-bottom:14px;color:var(--muted);font-size:11px}
    .selection-bar b{color:var(--blue);font:700 13px var(--font-head)}
    .text-btn{padding:5px 7px;color:var(--muted);font-size:11px}
    .text-btn:hover{color:var(--blue)}
    .page-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:18px;padding:2px 2px 20px;max-height:calc(100vh - 330px);overflow:auto}
    .page-card{position:relative;min-width:0;padding:9px 9px 0;border:1px solid var(--line);border-radius:7px;background:var(--paper);box-shadow:0 3px 10px #244a7512;transition:.18s}
    .page-card:hover{border-color:color-mix(in srgb, var(--blue) 45%, var(--line));transform:translateY(-2px)}
    .page-card.selected{border:2px solid var(--blue);padding:8px 8px 0;box-shadow:0 5px 16px #2f6fed28}
    .page-card.dragging{opacity:.42}
    .page-card.split-boundary{border-left:3px solid var(--warn)}
    .page-check{position:absolute;z-index:1;top:7px;left:7px;width:18px;height:18px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:#fff;font:700 11px var(--font-head)}
    .selected .page-check{border-color:var(--blue);background:var(--blue)}
    .page-image-wrap{display:grid;place-items:center;height:155px;overflow:hidden;background:var(--soft)}
    .page-image{max-width:100%;max-height:100%;object-fit:contain;transform:rotate(var(--rotation));transition:.2s}
    .page-tools{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:.15s}
    .page-card:hover .page-tools{opacity:1}
    .page-tools button{width:22px;height:22px;display:grid;place-items:center;border-radius:4px;background:var(--paper);box-shadow:0 1px 4px #1b355417;color:var(--muted);font-size:13px}
    .page-tools button:hover{color:var(--blue)}
    .page-label{display:flex;align-items:center;gap:7px;min-width:0;padding:9px 2px 10px}
    .page-label span{color:var(--blue);font:700 11px var(--font-head)}
    .page-label small{overflow:hidden;color:var(--faint);font-size:9px;text-overflow:ellipsis;white-space:nowrap}

    .empty-state{min-height:220px;display:grid;place-content:center;justify-items:center;text-align:center}
    .empty-illustration{width:55px;height:55px;margin-bottom:15px;border:1px solid var(--line);border-radius:12px;color:var(--faint);background:var(--paper)}
    .secondary-btn{margin-top:17px;padding:9px 14px;border:1px solid var(--line);color:var(--navy);background:var(--paper);font-size:11px}

    .status-line{gap:7px;padding-top:10px;border-top:1px solid var(--line);color:var(--faint);font-size:10px}
    .status-dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
    .status-dot.warn{background:var(--warn)}
    .status-spacer{flex:1}

    .inspector{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--paper)}
    .inspector-head{display:flex;justify-content:space-between;padding:27px 21px 17px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700}
    .inspector-head span:last-child{color:var(--blue);font:700 12px var(--font-head)}
    .inspector-body{flex:1;padding:22px 21px;overflow:auto}
    .inspector-empty{display:grid;place-content:center;height:170px;color:var(--faint);text-align:center;font-size:11px;line-height:1.8}
    .inspector-preview{height:205px;display:grid;place-items:center;margin-bottom:24px;overflow:hidden;background:var(--soft)}
    .inspector-preview img{max-width:82%;max-height:85%;box-shadow:0 5px 15px #203a5525}
    .inspector-body dl{margin:0}
    .inspector-body dl div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
    .inspector-body dt{color:var(--faint);font-size:10px}
    .inspector-body dd{max-width:125px;overflow:hidden;margin:0;color:var(--muted);font:500 10px var(--font-head);text-overflow:ellipsis;white-space:nowrap}
    .inspector-footer{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:17px 21px 20px;border-top:1px solid var(--line)}
    .outline-btn{padding:8px 4px;border:1px solid var(--line);color:var(--muted);font-size:10px}
    .outline-btn:hover{border-color:color-mix(in srgb, var(--blue) 45%, var(--line));color:var(--blue)}

    .bottom-bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-top:1px solid var(--line);background:var(--paper)}
    .footer-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;color:var(--muted);font-size:10px}
    .footer-btn:hover:not(:disabled){color:var(--blue)}
    .footer-btn:disabled{opacity:.38;cursor:default}
    .save-actions{gap:16px}
    .save-actions>span{color:var(--faint);font-size:10px}
    .save-btn{padding:9px 16px;background:var(--blue);color:#fff;font-size:11px;box-shadow:0 4px 10px #2f6fed35}
    .save-btn:disabled{background:var(--line);color:var(--faint);box-shadow:none;cursor:default}

    .toast{position:fixed;right:24px;bottom:76px;z-index:5;padding:11px 15px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--paper);box-shadow:var(--shadow-pop);font-size:11px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast.error{border-color:var(--ng);color:var(--ng);background:var(--ng-bg)}

    .hidden{display:none!important}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="yt-mark" src="../assets/icon.png" alt=""><div><strong>PDF Craft</strong><small>ローカルワークスペース</small></div></div>
    <div class="top-actions">
      <a class="yt-back" href="../index.html">← ツール一覧</a>
      <button class="ghost-btn" id="helpBtn">? ヘルプ</button>
      <button class="primary-btn" id="addBtn">＋ PDFを追加</button>
      <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple hidden>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="side-label">WORKSPACE</div>
      <nav id="toolNav">
        <button class="tool-btn active" data-mode="home">⌂ ホーム</button>
        <button class="tool-btn" data-mode="merge">⇄ 結合</button>
        <button class="tool-btn" data-mode="organize">▤ ページ整理</button>
        <button class="tool-btn" data-mode="split">↕ 分割</button>
        <button class="tool-btn" data-mode="extract">⌗ ページ抽出</button>
        <button class="tool-btn" data-mode="rotate">↻ 回転</button>
      </nav>
      <div class="privacy-note"><span>◇</span><div><strong>端末内で処理</strong><p>PDFは外部へアップロードされません</p></div></div>
    </aside>

    <main class="main-area">
      <div class="workspace-head">
        <div>
          <div class="eyebrow">DOCUMENT WORKSPACE</div>
          <h1 id="pageTitle">ページを整理</h1>
          <p id="pageSubtitle">ドラッグ＆ドロップでページの順番を整えます。</p>
        </div>
        <div class="view-actions">
          <button class="square-btn" id="zoomOut" aria-label="縮小">−</button>
          <span id="zoomLabel">100%</span>
          <button class="square-btn" id="zoomIn" aria-label="拡大">＋</button>
          <button class="square-btn" id="resetZoom" aria-label="表示をリセット">↺</button>
        </div>
      </div>

      <div id="modeBar" class="mode-bar hidden"></div>

      <section id="dropZone" class="drop-zone">
        <div class="drop-icon">↑</div>
        <h2>PDFをここにドロップ</h2>
        <p>または <button class="inline-link" id="openLink">ファイルを選択</button>　複数ファイルにも対応しています</p>
        <span class="drop-meta">PDF / 最大容量はブラウザのメモリに依存</span>
      </section>

      <div id="workspace" class="workspace hidden">
        <div class="selection-bar">
          <span><b id="selectionCount">0</b> ページ選択中</span>
          <div>
            <button class="text-btn" id="selectByRange">番号で選択</button>
            <button class="text-btn" id="selectAll">すべて選択</button>
            <button class="text-btn" id="clearSelection">選択解除</button>
            <button class="text-btn" id="deleteSelected">⌫ 削除</button>
          </div>
        </div>
        <div id="pageGrid" class="page-grid"></div>
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-illustration">▤</div>
        <h2>編集するPDFを追加してください</h2>
        <p>ファイルはこのブラウザの中だけで処理されます。</p>
        <button class="secondary-btn" id="emptyAdd">＋ PDFを追加</button>
      </div>

      <div class="status-line">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">準備完了</span>
        <span class="status-spacer"></span>
        <span id="pageCount">0ページ</span>
      </div>
    </main>

    <aside class="inspector">
      <div class="inspector-head"><span>選択中のページ</span><span id="inspectorIndex">—</span></div>
      <div id="inspectorBody" class="inspector-body"><div class="inspector-empty">ページを選択すると<br>詳細が表示されます。</div></div>
      <div class="inspector-footer">
        <button class="outline-btn" id="rotateLeft">↶ 左へ90°</button>
        <button class="outline-btn" id="rotateRight">↷ 右へ90°</button>
        <button class="outline-btn" id="duplicatePage">⧉ 複製</button>
        <button class="outline-btn" id="extractPage">⌗ 抽出</button>
      </div>
    </aside>
  </div>

  <footer class="bottom-bar">
    <div class="history-actions">
      <button class="footer-btn" id="undoBtn" disabled>↶ 元に戻す</button>
      <button class="footer-btn" id="redoBtn" disabled>↷ やり直す</button>
      <button class="footer-btn" id="resetBtn">↻ リセット</button>
    </div>
    <div class="save-actions">
      <span id="saveHint">PDFを追加すると保存できます</span>
      <button class="save-btn" id="saveBtn" disabled>↓ PDFを保存</button>
    </div>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <script src="lib/pdf-lib.min.js"></script>
  <script src="lib/jszip.min.js"></script>
  <script src="lib/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
