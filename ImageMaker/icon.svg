<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">ImageMaker</title>
  <desc id="desc">画像フレームときらめきを組み合わせたImageMakerのアイコン</desc>

  <!-- App tile -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#5B6BF5"/>

  <!-- Image canvas -->
  <rect x="14" y="16" width="34" height="32" rx="6"
        fill="none" stroke="#FFFFFF" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sun / point -->
  <circle cx="37" cy="26" r="3.2" fill="#FFFFFF"/>

  <!-- Mountain / image motif -->
  <path d="M18 43L27 33.5L33 39L38 34.5L45 43"
        fill="none" stroke="#FFFFFF" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Maker sparkle -->
  <path d="M49 11
           C49.6 14.8 51.2 16.4 55 17
           C51.2 17.6 49.6 19.2 49 23
           C48.4 19.2 46.8 17.6 43 17
           C46.8 16.4 48.4 14.8 49 11Z"
        fill="#FFFFFF"/>

  <!-- Small accent sparkle -->
  <path d="M54 28
           C54.3 29.9 55.1 30.7 57 31
           C55.1 31.3 54.3 32.1 54 34
           C53.7 32.1 52.9 31.3 51 31
           C52.9 30.7 53.7 29.9 54 28Z"
        fill="#FFFFFF" opacity=".9"/>
</svg>
